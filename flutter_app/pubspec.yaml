name: vega
description: "Vega (वेग) - High-speed offline P2P file transfer & cross-platform sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.6
  bonsoir: ^5.1.10
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.1
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  crypto: ^3.0.6
  convert: ^3.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: '>=18.0.1 <19.0.0'
  sqflite: ^2.4.1
  shared_preferences: ^2.3.5
  device_info_plus: ^11.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
