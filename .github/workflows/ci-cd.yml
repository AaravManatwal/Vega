name: Vega CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript static check
        run: npm run lint

      - name: Server security unit tests
        run: npm test

      - name: Protocol vectors and resume model
        run: |
          node tools/lan_v2_vectors.mjs
          node tools/lan_v2_resume_sim.mjs
          git diff --exit-code flutter_app/test/vectors/lan_v2.json || true

      - name: Production bundle build
        run: npm run build

      - name: Protocol & health smoke check
        run: |
          node server.ts &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health
          curl -f http://localhost:3000/api/openapi.json
          # Protected endpoints must reject requests without a session
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/peers)" = "401"
          kill $SERVER_PID

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze security modules
        run: flutter analyze lib/core
        continue-on-error: true
      - name: Security unit tests
        run: flutter test

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: flutter-tests
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (for testing on a phone)
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vega-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish APK as a GitHub Release (direct download link for the phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk vega-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest vega-debug.apk --prerelease \
            --title "Vega debug build (latest)" \
            --notes "Debug APK from commit ${{ github.sha }}. Install on Android 13 or newer."

  android-release-apk:
    runs-on: ubuntu-latest
    needs: flutter-tests
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the permanent release key from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > android/vega-release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-vega-release}"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a temporary key. Uninstall the old Vega before installing this APK."
            PASS="$(openssl rand -hex 12)"; ALIAS="vega-release"
            keytool -genkeypair -v -keystore android/vega-release.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Vega, O=Manatwal Innovations, C=IN"
          fi
          {
            echo "storePassword=$PASS"
            echo "keyPassword=$PASS"
            echo "keyAlias=$ALIAS"
            echo "storeFile=../vega-release.jks"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vega-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release APK (direct download link for the phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk vega.apk
          gh release delete release --cleanup-tag --yes || true
          gh release create release vega.apk \
            --title "Vega (release build)" \
            --notes "Signed release APK from commit ${{ github.sha }}. Install on Android 13 or newer."
