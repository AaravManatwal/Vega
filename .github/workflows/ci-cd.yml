name: Vega CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript static check
        run: npm run lint

      - name: Server security unit tests
        run: npm test

      - name: Protocol vectors and resume model
        run: |
          node tools/lan_v2_vectors.mjs
          node tools/lan_v2_resume_sim.mjs
          git diff --exit-code flutter_app/test/vectors/lan_v2.json || true

      - name: Production bundle build
        run: npm run build

      - name: Protocol & health smoke check
        run: |
          node server.ts &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health
          curl -f http://localhost:3000/api/openapi.json
          # Protected endpoints must reject requests without a session
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/peers)" = "401"
          kill $SERVER_PID

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze security modules
        run: flutter analyze lib/core
        continue-on-error: true
      - name: Security unit tests
        run: flutter test

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: flutter-tests
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (for testing on a phone)
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vega-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish APK as a GitHub Release (direct download link for the phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk vega-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest vega-debug.apk --prerelease \
            --title "Vega debug build (latest)" \
            --notes "Debug APK from commit ${{ github.sha }}. Install on Android 13 or newer."
